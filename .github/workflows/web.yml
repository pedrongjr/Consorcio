name: Web (Minhas Finanças)

on:
  push:
    paths: ['financas-app/**', '.github/workflows/web.yml', 'render.yaml']
  pull_request:
    paths: ['financas-app/**', '.github/workflows/web.yml', 'render.yaml']
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: financas-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: financas-app/package-lock.json
      - run: npm ci
      - name: Tipos e lint
        run: |
          npm run typecheck
          npx eslint src server scripts
      - name: Testes (núcleo + API com isolamento entre usuários)
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-password@localhost:5432/postgres
        run: npm test
      - name: Build web e servidor
        run: |
          npm run build:web
          npm run build:server

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nome da imagem em minúsculas
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/minhas-financas-web" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: financas-app
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
