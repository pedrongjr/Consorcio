# Blueprint do Render: cria o banco Postgres e o serviço web do Minhas Finanças.
# No painel do Render: New → Blueprint → escolha este repositório.
databases:
  - name: minhas-financas-db
    databaseName: financas
    user: financas
    plan: free

services:
  - type: web
    name: minhas-financas
    runtime: docker
    rootDir: financas-app
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: minhas-financas-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
